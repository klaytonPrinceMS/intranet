[pytest]
testpaths = assets/test/test_suite.py
# kbp-devSecOps 2026-09-19 — otimização de execução (complementa kbp-qa 46→38):
# - markers permitem rodar subconjuntos sem sobrecarregar: -m "security and not slow"
# - cacheprovider reativado para --lf/--failed-first (graphify affected usa cache)
# - timeout por script (240s) já em test_suite.py; aqui apenas filtros e verbosidade
addopts = --strict-markers -ra --tb=short
markers =
    security: testes de segurança (traversal, XSS, B608, owner-isolation, LGPD)
    e2e: Playwright E2E (requer .venv/bin/python main.py em localhost:8080)
    slow: teste lento (>30s) — pular em CI rápido com -m "not slow"
    unit: teste unitário rápido
    graphify: saúde do grafo (affected, diagnose)
    k6: carga/performance — apenas localhost/staging, NUNCA produção
    docs: mkdocs build --strict e docs online vs local