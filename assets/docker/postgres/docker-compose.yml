# =============================================================================
# PostgreSQL container for Intranet Modular (optional backend)
# =============================================================================
# Suba com:
#   cd assets/docker/postgres && docker compose up -d
#
# Depois, no /configuracoes → "Banco de dados", marque "PostgreSQL" e
# REINICIE o servidor. Todos os módulos passam a usar o banco `intranet`
# (um schema por módulo: intranet, blog, usuarios, auditoria, editar_pdf,
# empenhos, solicita_impressao).
#
# ⚠️ Apenas desenvolvimento/staging — não exponha a porta 5432 em produção.
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: intranet_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intranet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intranet}
      POSTGRES_DB: ${POSTGRES_DB:-intranet}
    ports:
      - "5432:5432"
    volumes:
      - intranet_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-intranet} -d ${POSTGRES_DB:-intranet}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  intranet_pgdata: